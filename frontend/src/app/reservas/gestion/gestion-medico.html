<p-dialog [(visible)]="visible" [header]="header()" [modal]="true" [style]="{width: '28rem'}" [draggable]="false" [resizable]="false">
    <div class="flex flex-column gap-3 p-fluid py-2" *ngIf="medicoSeleccionado()">
        <div class="field">
            <label for="valorConsulta" class="font-bold block mb-2">Nuevo Valor de Consulta</label>
            <p-inputNumber 
                id="valorConsulta" 
                [(ngModel)]="valorConsulta" 
                mode="currency" 
                currency="ARS" 
                locale="es-AR" 
                placeholder="Ej. 20000" />
        </div>
    </div>

    <ng-template pTemplate="footer">
        <div class="flex justify-content-end gap-2">
            <p-button label="Cancelar" icon="pi pi-times" severity="secondary" (onClick)="cerrar()" />
            <p-button label="Guardar" icon="pi pi-check" severity="success" [loading]="guardando()" (onClick)="guardar()" />
        </div>
    </ng-template>
</p-dialog>
