        <!-- Cabecera -->
        <div class="flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h2 class="m-0 text-xl font-bold">Listado de Médicos</h2>
        </div>

        <!-- Tabla PrimeNG -->
        <p-table [value]="medicos()" [loading]="cargando()" [paginator]="true" [rows]="7" class="p-datatable-striped">
            <ng-template pTemplate="header">
                <tr>
                    <th>Matrícula</th>
                    <th>Apellidos y Nombres</th>
                    <th>Valor Consulta</th>
                    <th class="text-center">Acciones</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-medico>
                <tr>
                    <td>{{ medico.matricula }}</td>
                    <td>{{ medico.apellidos }}, {{ medico.nombres }}</td>
                    <td>$ {{ medico.valorConsulta}}</td>
                    <td class="text-center">
                        <div class="flex justify-content-center gap-2">
                            <p-button icon="pi pi-pencil" severity="info" [text]="true" pTooltip="Modificar valor de consulta" (onClick)="editarValorConsulta(medico)" />
                            
                        </div>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4" class="text-center p-4">No se encontraron médicos registrados.</td>
                </tr>
            </ng-template>
        </p-table>


    <!-- ConfirmDialog nativo -->
    <p-confirmDialog />

    <!-- Modal de Gestión de Médico -->
    <app-gestion-medico 
        [(visible)]="dialogVisible" 
        [(medicoSeleccionado)]="medicoSeleccionado" 
        (medicoGuardado)="refrescarMedicos()" />
